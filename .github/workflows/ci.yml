name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: queue_assignment_test
          MARIADB_USER: queue_assignment
          MARIADB_PASSWORD: queue_assignment
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_KEY: base64:cXVldWUtYXNzaWdubWVudC10ZXN0LWtleS0zMmNoYXJzIQ==
      JWT_SECRET: queue-assignment-ci-jwt-secret-change-me
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: queue_assignment_test
      DB_USERNAME: queue_assignment
      DB_PASSWORD: queue_assignment
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: ./vendor/bin/pint --test
      - run: php artisan migrate:fresh --force
      - run: php artisan test
      - name: Validate Compose
        working-directory: .
        run: docker compose config --quiet
