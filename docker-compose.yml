services:
  app:
    build:
      context: ./src
      dockerfile: docker/php/Dockerfile
    environment:
      APP_NAME: Queue Assignment
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:cXVldWUtYXNzaWdubWVudC1kZXYta2V5LTMyY2hhciE=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: https://localhost:8443
      JWT_SECRET: ${JWT_SECRET:-queue-assignment-local-jwt-secret-change-me}
      JWT_ISSUER: queue-assignment
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-queue_assignment}
      DB_USERNAME: ${DB_USERNAME:-queue_assignment}
      DB_PASSWORD: ${DB_PASSWORD:-queue_assignment}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_SEEDER: ${RUN_SEEDER:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-admin}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operator@example.test}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-change-me-operator}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./src
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./.certs/localhost.pem:/etc/nginx/certs/server.crt:ro
      - ./.certs/localhost-key.pem:/etc/nginx/certs/server.key:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-queue_assignment}
      MARIADB_USER: ${DB_USERNAME:-queue_assignment}
      MARIADB_PASSWORD: ${DB_PASSWORD:-queue_assignment}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-queue_assignment-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
